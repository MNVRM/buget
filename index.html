<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buget</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a4d">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f2;--sf:#fff;--tx:#17211b;--mu:#66746b;--ln:#dde3de;--in:#1f7a4d;--ex:#b4472f;--sa:#2b5fa8;--ac:#17211b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111613;--sf:#1a211d;--tx:#e8eee9;--mu:#8e9c93;--ln:#2a342d;--in:#4fc189;--ex:#e8836b;--sa:#7aa7e6;--ac:#e8eee9;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 12px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mon button{width:44px;height:44px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font-size:20px}
.mon b{font-size:17px}
.bal{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
.bal small{color:var(--mu)}
.bal .big{font:700 34px/1.1 Georgia,serif;margin:2px 0 12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 div{border-left:3px solid var(--ln);padding-left:8px}
.row3 small{display:block;color:var(--mu);font-size:12px}
.row3 span{font-weight:600;font-size:15px}
.i{border-color:var(--in)!important}.e{border-color:var(--ex)!important}.s{border-color:var(--sa)!important}
form{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;display:grid;gap:8px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--ln);border-radius:10px;font-size:14px}
.seg input:checked+span{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.seg input:focus-visible+span{outline:2px solid var(--sa);outline-offset:2px}
input[type=number],input[type=date],input[type=text],select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{padding:12px;border:0;border-radius:10px;background:var(--in);color:#fff;font:600 16px inherit;font-family:inherit}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.bar{margin:6px 0;font-size:14px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--ex);margin-top:3px}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.tx:first-of-type{border-top:0}
.tx div{flex:1;min-width:0}.tx small{color:var(--mu)}
.tx b{white-space:nowrap}
.tx button{border:0;background:none;color:var(--mu);font-size:20px;width:36px;height:36px}
.empty{color:var(--mu);font-size:14px;margin:4px 0}
[hidden]{display:none!important}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button{padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit}
.tabs .on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
summary{font-weight:600;cursor:pointer;min-height:24px}
.cap{color:var(--mu);font-size:13px;margin:6px 0 0}
svg{display:block;max-width:100%}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{border-left:3px solid var(--ln);padding-left:8px}
.kpi small{display:block;color:var(--mu);font-size:12px}
</style>
</head>
<body>
<main>
<h1>Buget personal</h1>
<div class="tabs"><button id="tm" class="on">Lună</button><button id="ty">An</button></div>
<div class="mon"><button id="pv" aria-label="Luna anterioară">‹</button><b id="ml"></b><button id="nx" aria-label="Luna următoare">›</button></div>
<section class="bal">
<small id="sl">Sold lunar</small>
<div class="big" id="sold">0 lei</div>
<div class="row3">
<div class="s"><small>Salariu</small><span id="tS">0</span></div>
<div class="i"><small>Alte venituri</small><span id="tI">0</span></div>
<div class="e"><small>Cheltuieli</small><span id="tE">0</span></div>
</div>
</section>
<form id="f">
<div class="seg" role="radiogroup" aria-label="Tip">
<label><input type="radio" name="t" value="e" checked><span>Cheltuială</span></label>
<label><input type="radio" name="t" value="s"><span>Salariu</span></label>
<label><input type="radio" name="t" value="i"><span>Venit</span></label>
</div>
<div class="two"><input type="number" id="a" placeholder="Sumă (lei)" step="0.01" min="0" required inputmode="decimal"><input type="date" id="d" required></div>
<div class="two"><select id="c"></select><input type="text" id="n" placeholder="Notă (opțional)"></div>
<button class="add">Adaugă</button>
</form>
<details class="card" id="cm"><summary>Categoriile mele</summary>
<div class="two" style="margin-top:10px"><select id="ct"><option value="e">Cheltuială</option><option value="i">Venit</option></select><input type="text" id="cn" placeholder="Nume categorie" maxlength="24"></div>
<button type="button" class="add" id="cadd" style="width:100%;margin-top:8px">Adaugă categorie</button>
<div id="cu"></div></details>
<div id="vm"><section class="card"><h2>Cheltuieli pe categorii</h2><div id="donut"></div><div id="cats"></div></section>
<section class="card"><h2>Cheltuieli pe zile</h2><div id="days"></div></section></div>
<div id="vy" hidden>
<section class="card"><h2>Rezumat anual</h2><div class="kpi" id="kpi"></div></section>
<section class="card"><h2>Venituri și cheltuieli pe luni</h2><div id="yb"></div><p class="cap"><span style="color:var(--in)">■</span> venituri &nbsp; <span style="color:var(--ex)">■</span> cheltuieli</p></section>
<section class="card"><h2>Sold cumulat</h2><div id="yl"></div></section>
<section class="card"><h2>Cheltuieli pe categorii în an</h2><div id="yc"></div></section></div>
<section class="card" id="cl"><h2>Tranzacții</h2><div id="list"></div></section>
</main>
<script>
var CE=["Mâncare","Chirie și utilități","Transport","Facturi","Distracție","Sănătate","Haine","Altele"];
var CI=["Salariu","Extra","Bonus","Altele"];
var data=[],cur=new Date();cur.setDate(1);
try{data=JSON.parse(localStorage.getItem("buget")||"[]")}catch(e){data=[]}
var CU={e:[],i:[]};try{CU=JSON.parse(localStorage.getItem("buget_cat")||"")||CU}catch(e){}
function saveC(){try{localStorage.setItem("buget_cat",JSON.stringify(CU))}catch(e){}}
function save(){try{localStorage.setItem("buget",JSON.stringify(data))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var fmt=function(x){return x.toLocaleString("ro-RO",{maximumFractionDigits:2})+" lei"};
function today(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function type(){return document.querySelector("input[name=t]:checked").value}
function fillCats(){var l=type()=="e"?CE.concat(CU.e):(type()=="s"?["Salariu"]:CI.concat(CU.i));$("c").innerHTML=l.map(function(x){return "<option>"+x+"</option>"}).join("")}
function render(){if(mode=="y"){renderY();return}
var key=cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0");
$("ml").textContent=cur.toLocaleDateString("ro-RO",{month:"long",year:"numeric"});
var m=data.filter(function(x){return x.d.slice(0,7)==key}).sort(function(a,b){return b.d.localeCompare(a.d)});
var s=0,i=0,e=0,by={};
m.forEach(function(x){if(x.t=="s")s+=x.a;else if(x.t=="i")i+=x.a;else{e+=x.a;by[x.c]=(by[x.c]||0)+x.a}});
$("tS").textContent=fmt(s);$("tI").textContent=fmt(i);$("tE").textContent=fmt(e);
$("sold").textContent=fmt(s+i-e);$("sold").style.color=(s+i-e)<0?"var(--ex)":"var(--tx)";
drawM(by,e,m);var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
$("cats").innerHTML=ks.length?ks.map(function(k){return "<div class='bar'>"+k+" · "+fmt(by[k])+"<i style='width:"+Math.round(by[k]/e*100)+"%'></i></div>"}).join(""):"<p class='empty'>Nicio cheltuială în luna asta.</p>";
$("list").innerHTML=m.length?m.map(function(x){var sg=x.t=="e"?"−":"+";var col=x.t=="e"?"var(--ex)":(x.t=="s"?"var(--sa)":"var(--in)");
return "<div class='tx'><div>"+x.c+(x.n?" · "+esc(x.n):"")+"<br><small>"+x.d.split("-").reverse().join(".")+"</small></div><b style='color:"+col+"'>"+sg+fmt(x.a)+"</b><button data-id='"+x.id+"' aria-label='Șterge'>×</button></div>"}).join(""):"<p class='empty'>Adaugă prima tranzacție mai sus.</p>";
}
function esc(t){return t.replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
document.querySelectorAll("input[name=t]").forEach(function(r){r.onchange=fillCats});
$("f").onsubmit=function(ev){ev.preventDefault();
data.push({id:Date.now(),t:type(),a:parseFloat($("a").value),d:$("d").value,c:$("c").value,n:$("n").value.trim()});
save();$("a").value="";$("n").value="";render()};
$("list").onclick=function(ev){var id=ev.target.getAttribute("data-id");if(id){data=data.filter(function(x){return x.id!=id});save();render()}};
$("pv").onclick=function(){cur.setMonth(cur.getMonth()-(mode=="y"?12:1));render()};
$("nx").onclick=function(){cur.setMonth(cur.getMonth()+(mode=="y"?12:1));render()};
var mode="m",PAL=["#1f7a4d","#2b5fa8","#b4472f","#c28a1c","#7a4fa8","#2a9aa0","#a84f7f","#6b7a70"],ML=["I","F","M","A","M","I","I","A","S","O","N","D"];
function drawM(by,e,m){
var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
if(!ks.length){$("donut").innerHTML="";$("days").innerHTML="<p class='empty'>Nicio cheltuială în luna asta.</p>";return}
var R=55,C=2*Math.PI*R,off=0,h="<svg viewBox='0 0 300 150' role='img' aria-label='Cheltuieli pe categorii'><g transform='translate(75,75) rotate(-90)'>";
ks.forEach(function(k,j){var l=by[k]/e*C;h+="<circle r='"+R+"' fill='none' stroke='"+PAL[j%8]+"' stroke-width='26' stroke-dasharray='"+l+" "+(C-l)+"' stroke-dashoffset='"+(-off)+"'/>";off+=l});
h+="</g><text x='75' y='72' text-anchor='middle' font-size='11' fill='currentColor' opacity='.6'>Total</text><text x='75' y='88' text-anchor='middle' font-size='13' font-weight='700' fill='currentColor'>"+Math.round(e)+"</text>";
ks.slice(0,7).forEach(function(k,j){h+="<rect x='158' y='"+(18+j*18)+"' width='10' height='10' rx='2' fill='"+PAL[j%8]+"'/><text x='174' y='"+(27+j*18)+"' font-size='11' fill='currentColor'>"+k.slice(0,15)+" "+Math.round(by[k]/e*100)+"%</text>"});
$("donut").innerHTML=h+"</svg>";
var n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),dd=[],j;for(j=0;j<n;j++)dd.push(0);
m.forEach(function(x){if(x.t=="e")dd[parseInt(x.d.slice(8))-1]+=x.a});
var mx=Math.max.apply(null,dd),w=300/n,bi=dd.indexOf(mx);
h="<svg viewBox='0 0 300 120' role='img' aria-label='Cheltuieli pe zile'>";
dd.forEach(function(v,j){var hh=v/mx*90;h+="<rect x='"+(j*w+1)+"' y='"+(100-hh)+"' width='"+(w-2)+"' height='"+hh+"' rx='1.5' fill='var(--ex)'/>"});
h+="<line x1='0' x2='300' y1='100.5' y2='100.5' stroke='var(--ln)'/>";
[1,Math.round(n/2),n].forEach(function(d){h+="<text x='"+((d-.5)*w)+"' y='114' font-size='10' text-anchor='middle' fill='currentColor' opacity='.6'>"+d+"</text>"});
$("days").innerHTML=h+"</svg><p class='cap'>Medie pe zi: "+fmt(e/n)+" · Cea mai scumpă zi: "+(bi+1)+" ("+fmt(mx)+")</p>"}
function renderY(){
var y=cur.getFullYear(),inc=[],ex=[],cat={},S=0,I=0,E=0,j;$("ml").textContent=y;
for(j=0;j<12;j++){inc.push(0);ex.push(0)}
data.forEach(function(x){if(x.d.slice(0,4)!=y)return;var mo=+x.d.slice(5,7)-1;if(x.t=="e"){ex[mo]+=x.a;E+=x.a;cat[x.c]=(cat[x.c]||0)+x.a}else{inc[mo]+=x.a;if(x.t=="s")S+=x.a;else I+=x.a}});
$("tS").textContent=fmt(S);$("tI").textContent=fmt(I);$("tE").textContent=fmt(E);
var b=S+I-E;$("sold").textContent=fmt(b);$("sold").style.color=b<0?"var(--ex)":"var(--tx)";
var last=-1;for(j=0;j<12;j++)if(inc[j]||ex[j])last=j;
if(last<0){$("kpi").innerHTML="<p class='empty'>Nicio tranzacție în anul acesta.</p>";$("yb").innerHTML=$("yl").innerHTML=$("yc").innerHTML="";return}
var nm=last+1,sr=(S+I)>0?Math.round(b/(S+I)*100):0,mi=ex.indexOf(Math.max.apply(null,ex));
$("kpi").innerHTML="<div><small>Rată de economisire</small><b>"+sr+"%</b></div><div><small>Cheltuieli medii / lună</small><b>"+fmt(E/nm)+"</b></div><div><small>Venituri medii / lună</small><b>"+fmt((S+I)/nm)+"</b></div><div><small>Luna cea mai scumpă</small><b>"+ML.length*0+["Ian","Feb","Mar","Apr","Mai","Iun","Iul","Aug","Sep","Oct","Nov","Dec"][mi]+"</b></div>";
var mx=Math.max.apply(null,inc.concat(ex)),h="<svg viewBox='0 0 300 140' role='img' aria-label='Venituri și cheltuieli pe luni'>";
for(j=0;j<12;j++){var a=inc[j]/mx*105,c=ex[j]/mx*105;h+="<rect x='"+(j*25+3)+"' y='"+(120-a)+"' width='9' height='"+a+"' rx='1.5' fill='var(--in)'/><rect x='"+(j*25+13)+"' y='"+(120-c)+"' width='9' height='"+c+"' rx='1.5' fill='var(--ex)'/><text x='"+(j*25+12.5)+"' y='134' font-size='10' text-anchor='middle' fill='currentColor' opacity='.6'>"+ML[j]+"</text>"}
$("yb").innerHTML=h+"<line x1='0' x2='300' y1='120.5' y2='120.5' stroke='var(--ln)'/></svg>";
var cu=[],t=0;for(j=0;j<=last;j++){t+=inc[j]-ex[j];cu.push(t)}
var hi=Math.max.apply(null,cu.concat(0)),lo=Math.min.apply(null,cu.concat(0)),sp=(hi-lo)||1,Y=function(v){return 10+(hi-v)/sp*90};
var pts=cu.map(function(v,j){return (12.5+j*25)+","+Y(v)}).join(" ");
h="<svg viewBox='0 0 300 120' role='img' aria-label='Sold cumulat'><line x1='0' x2='300' y1='"+Y(0)+"' y2='"+Y(0)+"' stroke='var(--ln)' stroke-dasharray='4 3'/><polyline points='"+pts+"' fill='none' stroke='var(--sa)' stroke-width='2.5' stroke-linejoin='round'/>";
cu.forEach(function(v,j){h+="<circle cx='"+(12.5+j*25)+"' cy='"+Y(v)+"' r='3' fill='var(--sa)'/>"});
for(j=0;j<12;j++)h+="<text x='"+(12.5+j*25)+"' y='116' font-size='10' text-anchor='middle' fill='currentColor' opacity='.6'>"+ML[j]+"</text>";
$("yl").innerHTML=h+"</svg><p class='cap'>Sold la sfârșitul perioadei: "+fmt(t)+"</p>";
var ks=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]});
$("yc").innerHTML=ks.length?ks.map(function(k){return "<div class='bar'>"+k+" · "+fmt(cat[k])+" ("+Math.round(cat[k]/E*100)+"%)<i style='width:"+Math.round(cat[k]/E*100)+"%'></i></div>"}).join(""):"<p class='empty'>Nicio cheltuială.</p>"}
function setMode(x){mode=x;$("tm").className=x=="m"?"on":"";$("ty").className=x=="y"?"on":"";
["f","cl","vm","cm"].forEach(function(i){$(i).hidden=x=="y"});$("vy").hidden=x!="y";
$("sl").textContent=x=="y"?"Sold anual":"Sold lunar";render()}
$("tm").onclick=function(){setMode("m")};$("ty").onclick=function(){setMode("y")};
function drawCU(){var h="";["e","i"].forEach(function(t){CU[t].forEach(function(c,j){h+="<div class='tx'><div>"+esc(c)+"<br><small>"+(t=="e"?"Cheltuială":"Venit")+"</small></div><button data-t='"+t+"' data-j='"+j+"' aria-label='Șterge categoria'>×</button></div>"})});$("cu").innerHTML=h||"<p class='empty'>Nicio categorie proprie încă.</p>"}
$("cadd").onclick=function(){var n=$("cn").value.trim(),t=$("ct").value;if(!n)return;if((t=="e"?CE:CI).concat(CU[t]).indexOf(n)<0){CU[t].push(n);saveC()}$("cn").value="";drawCU();fillCats()};
$("cn").onkeydown=function(ev){if(ev.key=="Enter"){ev.preventDefault();$("cadd").onclick()}};
$("cu").onclick=function(ev){var t=ev.target.getAttribute("data-t");if(t){CU[t].splice(+ev.target.getAttribute("data-j"),1);saveC();drawCU();fillCats()}};
drawCU();
$("d").value=today();fillCats();render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
